<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>🩸 GlucoControl v4</title>

   <!-- CSS -->
   <link rel="stylesheet" href="css/styles.css">

   <!-- LIBRERÍAS -->
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

   <!-- HEADER -->
   <header class="header">
      <h1>🩸 GlucoControl</h1>
      <div id="userBadge" class="user-badge">Sin usuario</div>
   </header>

   <!-- ===================== AUTH ===================== -->
   <section id="authSection" class="auth-section">

      <!-- LOGIN -->
      <div id="loginBox" class="card">

         <h2>🔐 Iniciar sesión</h2>

         <input id="loginUser" type="text" placeholder="Usuario">
         <input id="loginPass" type="password" placeholder="Contraseña">

         <button onclick="login()">Entrar</button>
         <button onclick="toggleAuth()">Crear cuenta</button>

      </div>

      <!-- REGISTER -->
      <div id="registerBox" class="card hidden">

         <h2>🆕 Registro</h2>

         <input id="regUser" type="text" placeholder="Usuario">
         <input id="regPass" type="password" placeholder="Contraseña">

         <button onclick="register()">Registrar</button>
         <button onclick="toggleAuth()">Volver al login</button>

      </div>

   </section>

   <!-- ===================== APP ===================== -->
   <section id="appSection" class="app hidden">

      <!-- SIDEBAR -->
      <aside class="sidebar">

         <button onclick="showSection('dashboard')">📊 Dashboard</button>
         <button onclick="showSection('registerRecord')">➕ Registrar</button>
         <button onclick="showSection('history')">📋 Historial</button>

         <hr>

         <button onclick="exportJSON()">💾 Exportar JSON</button>
         <button onclick="importJSON()">📥 Importar JSON</button>
         <button onclick="exportPDF()">📄 PDF Médico</button>

         <hr>

         <button onclick="logout()">🚪 Cerrar sesión</button>
         <button onclick="deleteMyData()">🗑 Eliminar mis datos</button>
         <button onclick="deleteAccount()">❌ Eliminar cuenta</button>

      </aside>

      <!-- MAIN -->
      <main class="main">

         <!-- ================= DASHBOARD ================= -->
         <section id="dashboard" class="section">

            <h2>📊 Dashboard</h2>

            <!-- STATS -->
            <div id="statsContainer" class="stats"></div>

            <!-- FILTERS -->
            <div class="chart-filters">

               <button onclick="filterChart('day')">Día</button>
               <button onclick="filterChart('week')">Semana</button>
               <button onclick="filterChart('month')">Mes</button>
               <button onclick="filterChart('year')">Año</button>
               <button onclick="filterChart('all')">Todo</button>

            </div>

            <!-- CHART -->
            <canvas id="glucoseChart"></canvas>

         </section>

         <!-- ================= REGISTER ================= -->
         <section id="registerRecord" class="section hidden">

            <h2>➕ Nuevo registro</h2>

            <div class="form">

               <input id="glucose" type="number" placeholder="Glucosa (mg/dL)">
               <input id="insulin" type="number" placeholder="Insulina (UI)">

               <label>📅 Fecha</label>
               <input id="recordDate" type="date">

               <label>🕒 Hora</label>
               <input id="recordTime" type="time">

               <label>🍽️ Comida</label>
               <select id="meal">

                  <option value="">Seleccionar</option>

                  <option>Desayuno</option>
                  <option>Post Desayuno (+2h)</option>

                  <option>Media Mañana</option>
                  <option>Post Media Mañana (+2h)</option>

                  <option>Almuerzo</option>
                  <option>Post Almuerzo (+2h)</option>

                  <option>Merienda</option>
                  <option>Post Merienda (+2h)</option>

                  <option>Cena</option>
                  <option>Post Cena (+2h)</option>

               </select>

               <label class="checkbox">
                  <input type="checkbox" id="correction" onchange="toggleFood()">
                  Solo corrección (sin comida)
               </label>

               <div id="foodBlock">
                  <input id="food" type="text" placeholder="¿Qué comió? (opcional)">
               </div>

               <button onclick="saveRecord()">💾 Guardar registro</button>

            </div>

         </section>

         <!-- ================= HISTORY ================= -->
         <section id="history" class="section hidden">

            <h2>📋 Historial</h2>

            <div id="historyContainer" class="history"></div>

         </section>

      </main>

   </section>

   <!-- JS MODULES -->
   <script src="js/storage.js"></script>
   <script src="js/auth.js"></script>
   <script src="js/records.js"></script>
   <script src="js/charts.js"></script>
   <script src="js/reports.js"></script>
   <script src="js/app.js"></script>

</body>

</html>
