<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>🩸 GlucoControl FINAL v3.1</title>

   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

   <style>
      body {
         margin: 0;
         font-family: Arial;
         background: #f4f6f8;
      }

      header {
         background: #1976d2;
         color: white;
         padding: 12px;
         display: flex;
         justify-content: space-between;
         align-items: center;
      }

      .user {
         background: #0d47a1;
         padding: 6px 10px;
         border-radius: 12px;
      }

      .container {
         display: flex;
         min-height: calc(100vh - 50px);
      }

      .sidebar {
         width: 220px;
         background: #263238;
         color: white;
         padding: 10px;
      }

      .sidebar button {
         width: 100%;
         padding: 10px;
         margin: 5px 0;
         background: #37474f;
         border: none;
         color: white;
         border-radius: 6px;
         cursor: pointer;
      }

      .main {
         flex: 1;
         padding: 15px;
      }

      .box {
         max-width: 350px;
         margin: 25px auto;
         background: white;
         padding: 20px;
         border-radius: 10px;
      }

      input,
      select,
      button {
         width: 100%;
         padding: 10px;
         margin: 5px 0;
      }

      .hidden {
         display: none;
      }

      .cards {
         display: grid;
         grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
         gap: 10px;
      }

      .card {
         background: white;
         padding: 10px;
         border-radius: 10px;
      }

      .filter-bar {
         display: flex;
         gap: 5px;
         flex-wrap: wrap;
         margin: 10px 0;
      }

      .filter-bar button {
         flex: 1;
         padding: 8px;
         background: #455a64;
         color: white;
         border: none;
         border-radius: 6px;
         cursor: pointer;
      }

      @media(max-width:768px) {
         .container {
            flex-direction: column;
         }

         .sidebar {
            width: 100%;
            display: flex;
            overflow-x: auto;
         }

         .sidebar button {
            flex: 1;
         }
      }
   </style>
</head>

<body>

   <header>
      <div>🩸 GlucoControl FINAL v3.1</div>
      <div id="user" class="user">Sin usuario</div>
   </header>

   <!-- AUTH -->
   <div id="auth">

      <div id="loginBox" class="box">
         <h3>🔐 Login</h3>
         <input id="loginUser" placeholder="Usuario">
         <input id="loginPass" type="password" placeholder="Contraseña">
         <button onclick="login()">Entrar</button>
         <button onclick="toggleAuth()">🆕 Registro</button>
      </div>

      <div id="registerBox" class="box hidden">
         <h3>🆕 Registro</h3>
         <input id="regUser" placeholder="Usuario">
         <input id="regPass" type="password" placeholder="Contraseña">
         <button onclick="register()">Crear</button>
         <button onclick="toggleAuth()">🔐 Login</button>
      </div>

   </div>

   <!-- APP -->
   <div id="app" class="hidden">

      <div class="container">

         <div class="sidebar">
            <button onclick="show('dash')">📊 Dashboard</button>
            <button onclick="show('form')">➕ Registro</button>
            <button onclick="show('hist')">📋 Historial</button>
            <button onclick="exportJSON()">💾 JSON</button>
            <button onclick="importJSON()">📂 Importar</button>
            <button onclick="exportPDF()">📄 PDF</button>
         </div>

         <div class="main">

            <!-- DASH -->
            <div id="dash">
               <h2>📊 Dashboard</h2>

               <div class="cards">
                  <div class="card">Última<br><span id="last">-</span></div>
                  <div class="card">Promedio<br><span id="avg">-</span></div>
                  <div class="card">Mín<br><span id="min">-</span></div>
                  <div class="card">Máx<br><span id="max">-</span></div>
               </div>

               <div class="filter-bar">
                  <button onclick="filterChart('all')">Todo</button>
                  <button onclick="filterChart('day')">Día</button>
                  <button onclick="filterChart('week')">Semana</button>
                  <button onclick="filterChart('month')">Mes</button>
                  <button onclick="filterChart('year')">Año</button>
               </div>

               <canvas id="chart"></canvas>

            </div>

            <!-- FORM -->
            <div id="form" class="hidden">
               <h2>➕ Registro clínico</h2>

               <input id="glucose" type="number" placeholder="Glucosa mg/dL">
               <input id="insulin" type="number" placeholder="Insulina UI">

               <select id="meal">
                  <option>Desayuno</option>
                  <option>Media mañana</option>
                  <option>Almuerzo</option>
                  <option>Merienda</option>
                  <option>Cena</option>
               </select>

               <label>
                  <input type="checkbox" id="correction" onchange="toggleFood()">
                  Solo corrección
               </label>

               <div id="foodBlock">
                  <input id="food" placeholder="¿Qué comió?">
               </div>

               <button onclick="save()">Guardar</button>
            </div>

            <!-- HISTORY -->
            <div id="hist" class="hidden">
               <h2>📋 Historial</h2>
               <div id="list"></div>
            </div>

         </div>
      </div>
   </div>

   <script>

      let db = JSON.parse(localStorage.getItem("gluco")) || {
         users: [],
         current: null,
         records: []
      };

      function saveDB() {
         localStorage.setItem("gluco", JSON.stringify(db));
      }

      /* AUTH */
      function toggleAuth() {
         loginBox.classList.toggle("hidden");
         registerBox.classList.toggle("hidden");
      }

      function login() {
         let u = loginUser.value;
         let p = loginPass.value;

         let user = db.users.find(x => x.username === u && x.password === p);

         if (user) {
            db.current = u;
            saveDB();
            start();
         } else alert("Error login");
      }

      function register() {
         db.users.push({
            username: regUser.value,
            password: regPass.value
         });
         saveDB();
         alert("Usuario creado");
      }

      function start() {
         auth.classList.add("hidden");
         app.classList.remove("hidden");
         user.innerHTML = "🔵 " + db.current;
         render();
         chartUpdate();
      }

      function show(v) {
         dash.classList.add("hidden");
         form.classList.add("hidden");
         hist.classList.add("hidden");
         document.getElementById(v).classList.remove("hidden");
      }

      /* SAVE + CLEAN FIELDS */
      function save() {

         db.records.push({
            id: Date.now(),
            user: db.current,
            glucose: +glucose.value,
            insulin: +insulin.value,
            meal: meal.value,
            food: correction.checked ? null : food.value,
            correction: correction.checked,
            date: new Date().toISOString()
         });

         saveDB();

         render();
         chartUpdate();

         /* 🧹 LIMPIAR CAMPOS */
         glucose.value = "";
         insulin.value = "";
         food.value = "";
         correction.checked = false;
         foodBlock.classList.remove("hidden");
      }

      /* TOGGLE FOOD */
      function toggleFood() {
         foodBlock.classList.toggle("hidden", correction.checked);
      }

      /* RENDER */
      function render() {

         let r = db.records.filter(x => x.user === db.current);

         list.innerHTML = r.map(x => `
<div class="card">
🩸 ${x.glucose} mg/dL | 💉 ${x.insulin}<br>
${x.correction ? "🟡 Corrección" : "🍽️ " + x.meal}<br>
${x.food ? "📝 " + x.food : ""}<br>
🕒 ${new Date(x.date).toLocaleString()}
</div>
`).join("");

         let g = r.map(x => x.glucose);

         last.innerHTML = g.at(-1) || 0;
         avg.innerHTML = (g.reduce((a, b) => a + b, 0) / g.length || 0).toFixed(1);
         min.innerHTML = Math.min(...g) || 0;
         max.innerHTML = Math.max(...g) || 0;
      }

      /* CHART */
      let chart;
      let currentFilter = "all";

      function filterChart(t) {
         currentFilter = t;
         chartUpdate();
      }

      function getFiltered() {

         let r = db.records.filter(x => x.user === db.current);
         let now = new Date();

         return r.filter(x => {
            let d = new Date(x.date);

            if (currentFilter === "day")
               return d.toDateString() === now.toDateString();

            if (currentFilter === "week")
               return (now - d) / (1000 * 60 * 60 * 24) <= 7;

            if (currentFilter === "month")
               return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();

            if (currentFilter === "year")
               return d.getFullYear() === now.getFullYear();

            return true;
         });
      }

      function chartUpdate() {

         let r = getFiltered();

         let labels = r.map(x => new Date(x.date).toLocaleString());
         let data = r.map(x => x.glucose);

         if (chart) chart.destroy();

         chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
               labels,
               datasets: [{
                  label: "Glucosa",
                  data,
                  borderColor: "blue",
                  fill: false,
                  tension: 0.3
               }]
            }
         });
      }

      /* EXPORT JSON */
      function exportJSON() {
         let blob = new Blob([JSON.stringify(db)], { type: "application/json" });
         let a = document.createElement("a");
         a.href = URL.createObjectURL(blob);
         a.download = "gluco_backup.json";
         a.click();
      }

      /* IMPORT JSON */
      function importJSON() {
         let i = document.createElement("input");
         i.type = "file";
         i.onchange = e => {
            let f = e.target.files[0];
            let r = new FileReader();
            r.onload = ev => {
               db = JSON.parse(ev.target.result);
               saveDB();
               location.reload();
            };
            r.readAsText(f);
         };
         i.click();
      }

      /* PDF */
      function exportPDF() {

         const { jsPDF } = window.jspdf;
         let doc = new jsPDF();

         let r = db.records.filter(x => x.user === db.current);

         let gluc = r.map(x => x.glucose);
         let avg = (gluc.reduce((a, b) => a + b, 0) / gluc.length || 0).toFixed(1);

         doc.text("INFORME GLUCOSA", 10, 10);
         doc.text("Usuario: " + db.current, 10, 20);
         doc.text("Promedio: " + avg, 10, 30);

         let y = 40;

         r.slice(-20).forEach(x => {
            doc.text(`${new Date(x.date).toLocaleString()} | ${x.glucose} | ${x.insulin}`, 10, y);
            y += 8;
         });

         doc.save("informe_glucosa.pdf");
      }

      /* AUTO LOGIN */
      if (db.current) start();

   </script>

</body>

</html>
